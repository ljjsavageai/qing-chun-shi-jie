<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta name="twitter:image" content="https://ljjsavageai.github.io/qing-chun-shi-jie/street-bg.webp" />
    <style>
      :root{
        --bg:#f4f6f1; --surface:#ffffff; --text:#22312a; --dim:#68766d;
        --border:#dde3d8; --accent:#d9482f; --green:#3e6b45; --gold:#b8860b;
      }
      *{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%}
      body{margin:0;background:var(--bg);color:var(--text);
        font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
        font-size:16px;line-height:1.5}
      button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
      button,[role="button"],input{min-height:2rem}
      img{display:block}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

      /* ── Header (frosted glass) ─────────────────────────── */
      header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.45);
        backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
        border-bottom:1px solid rgba(255,255,255,.5);box-shadow:0 1px 12px rgba(60,80,60,.08)}
      .wrap{max-width:48rem;margin:0 auto;padding-left:1rem;padding-right:1rem}
      .head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:.75rem;padding-top:.75rem;padding-bottom:.5rem}
      h1{font-size:1.5rem;line-height:1.25;font-weight:700;letter-spacing:.05em;margin:0}
      .addr{margin:.125rem 0 0;font-size:.875rem;color:var(--dim)}
      .qr-pair{display:flex;gap:.5rem;flex-shrink:0}
      .qr-btn{display:flex;flex-direction:column;align-items:center;gap:.25rem;min-height:0}
      .qr-thumb{width:3.5rem;height:3.5rem;border-radius:.5rem;overflow:hidden;border:1px solid var(--border);background:#fff;display:flex}
      .qr-thumb img{width:100%;height:100%;object-fit:cover}
      .qr-btn span{font-size:.75rem;color:var(--dim)}
      .head-collapse-btn{flex-shrink:0;border-radius:999px;padding:.375rem .625rem;font-size:.75rem;color:var(--dim);background:rgba(255,255,255,.6);outline:1px solid var(--border);min-height:2rem;align-self:flex-start}
      .head-collapsed-bar{display:none;align-items:center;justify-content:space-between;padding:.5rem 0}
      .head-collapsed-bar .mini-title{font-weight:700;font-size:1rem}
      header.head-collapsed .head-row,header.head-collapsed .dice-toggle-row,header.head-collapsed #dicePanelSlot,header.head-collapsed .search-bar{display:none}
      header.head-collapsed .head-collapsed-bar{display:flex}

      /* ── Dice ───────────────────────────────────────────── */
      .dice-toggle-row{display:flex;justify-content:center;padding-bottom:.25rem}
      .dice-toggle{display:flex;align-items:center;gap:.5rem;border-radius:999px;padding:.25rem .75rem .25rem .25rem;font-size:.875rem;font-weight:500;min-height:2.25rem}
      .dice-toggle:focus-visible,.search-bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
      .mini-die{width:2.25rem;height:2.25rem;border-radius:10px;box-shadow:0 4px 8px rgba(0,0,0,.18);outline:1px solid rgba(0,0,0,.15);
        background:conic-gradient(from 45deg,#ef4444 0 60deg,#f59e0b 60deg 120deg,#eab308 120deg 180deg,#22c55e 180deg 240deg,#3b82f6 240deg 300deg,#a855f7 300deg 360deg);
        display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;padding:5px;flex-shrink:0}
      .mini-die i{width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
      .dice-bounce{animation:dice-bounce 1.8s ease-in-out infinite}
      @keyframes dice-bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}55%{transform:translateY(0)}70%{transform:translateY(-2px)}}
      .dice-panel{margin-top:.375rem;border-radius:1rem;background:rgba(255,255,255,.6);
        box-shadow:0 1px 2px rgba(0,0,0,.05);outline:1px solid rgba(255,255,255,.6);
        backdrop-filter:blur(8px);padding:.75rem}
      .dice-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}
      .dice-panel-head p{flex:1;text-align:center;font-size:.875rem;font-weight:500;margin:.25rem 0 0}
      .fold-btn{flex-shrink:0;border-radius:999px;padding:.25rem .625rem;font-size:.75rem;font-weight:500;color:var(--dim);outline:1px solid var(--border);min-height:1.75rem}
      .dice-pair{margin-top:.625rem;display:flex;align-items:flex-start;justify-content:center;gap:2rem}
      .die-cell{display:flex;width:6rem;flex-direction:column;align-items:center;gap:.375rem}
      .die-cell>span{font-size:.75rem;line-height:1.3;text-align:center;color:var(--dim)}
      .big-die{width:3.5rem;height:3.5rem;border-radius:1rem;box-shadow:0 4px 8px rgba(0,0,0,.18);outline:1px solid rgba(0,0,0,.15);
        display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;padding:7px}
      .big-die i{width:9px;height:9px;border-radius:50%}
      .die-rainbow{background:conic-gradient(from 45deg,#ef4444 0 60deg,#f59e0b 60deg 120deg,#eab308 120deg 180deg,#22c55e 180deg 240deg,#3b82f6 240deg 300deg,#a855f7 300deg 360deg)}
      .die-rainbow i{background:#fff;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
      .die-gold{background:linear-gradient(135deg,#f9e29c 0%,#f3d67b 30%,#d9a514 62%,#b8860b 100%);outline-color:rgba(184,134,11,.6)}
      .die-gold i{background:#7a5b12;box-shadow:inset 0 1px 2px rgba(255,255,255,.5)}
      .dice-rolling{animation:dice-shake .28s linear infinite}
      @keyframes dice-shake{0%{transform:rotate(0) translate(0,0) scale(1)}20%{transform:rotate(-16deg) translate(-3px,-4px) scale(1.06)}40%{transform:rotate(13deg) translate(3px,2px) scale(.96)}60%{transform:rotate(-10deg) translate(-2px,3px) scale(1.05)}80%{transform:rotate(15deg) translate(3px,-3px) scale(.97)}100%{transform:rotate(0) translate(0,0) scale(1)}}
      .dice-outcome{margin-top:.5rem;min-height:2.75rem;display:flex;align-items:center;justify-content:center;text-align:center}
      .dice-flash{font-size:1rem;margin:0}
      .dice-flash .code{font-size:1.125rem;font-weight:700;color:var(--accent);margin-right:.5rem}
      .dice-result{display:flex;align-items:center;gap:.5rem;border-radius:999px;padding:.5rem 1rem;min-height:2.75rem}
      .dice-result.gold{background:#fdf6da;outline:1px solid #d9a514}
      .dice-result.rainbow{background:#fdf0ec;outline:1px solid rgba(217,72,47,.5)}
      .dice-result .code{font-size:1.125rem;font-weight:700}
      .dice-result .nm{font-size:1rem;font-weight:600}
      .dice-result .go{font-size:.875rem;color:var(--dim)}
      .dice-hint{font-size:.875rem;color:#8c6d1d;margin:0}
      .dice-idle{font-size:.875rem;color:var(--dim);margin:0}
      .dice-result-pop{animation:dice-pop .35s ease-out}
      @keyframes dice-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
      .cat-picker{margin-top:.75rem;border-top:1px solid rgba(255,255,255,.6);padding-top:.75rem}
      .cat-picker p{text-align:center;font-size:.875rem;font-weight:500;margin:0}
      .cat-circle{position:relative;width:248px;height:248px;margin:.5rem auto}
      .cat-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:5rem;height:5rem;border-radius:50%;
        background:var(--text);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.2)}
      .cat-center b{font-size:1rem;line-height:1.25}
      .cat-center span{font-size:11px;opacity:.8}
      .cat-node{position:absolute;left:50%;top:50%;width:4rem;height:4rem;border-radius:50%;
        display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.08);outline:1px solid rgba(0,0,0,.05);padding:0 .25rem}
      .cat-node b{font-size:.75rem;font-weight:600;line-height:1.25;text-align:center}
      .cat-node span{font-size:10px;opacity:.75}
      .cat-cancel-row{display:flex;justify-content:center}

      /* ── Search bar ─────────────────────────────────────── */
      .search-bar{display:flex;width:100%;align-items:center;gap:.5rem;border-radius:999px;background:rgba(255,255,255,.7);
        padding:.625rem 1rem;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.05);outline:1px solid rgba(255,255,255,.6);
        backdrop-filter:blur(8px);margin-bottom:.75rem;min-height:2.75rem}
      .search-bar span{font-size:.875rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .search-bar svg{flex-shrink:0;color:var(--dim)}

      /* ── Street ─────────────────────────────────────────── */
      main{max-width:48rem;margin:0 auto;padding:0 .75rem 2.5rem}
      @media(min-width:640px){main{padding-left:1rem;padding-right:1rem}}
      .dir-marker{display:flex;align-items:center;gap:.75rem;padding:.5rem 0}
      .dir-marker .line{height:1px;flex:1;background:var(--border)}
      .dir-marker .lbl{display:flex;align-items:center;gap:.375rem;font-size:.875rem;font-weight:600;letter-spacing:.1em}
      .dir-badge{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--text);color:#fff;font-size:.75rem;display:flex;align-items:center;justify-content:center;letter-spacing:0}
      .dir-badge.light{background:var(--surface);color:var(--text);border:1px solid var(--border)}
      .street{position:relative;overflow:hidden;border-radius:1rem;box-shadow:0 1px 2px rgba(0,0,0,.06);outline:1px solid rgba(0,0,0,.05)}
      .street-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
      .street-wash{position:absolute;inset:0;background:rgba(255,255,255,.25);pointer-events:none}
      .street-inner{position:relative;padding:1rem .5rem}
      @media(min-width:640px){.street-inner{padding-left:.75rem;padding-right:.75rem}}
      .street-grid{display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);gap:0 .25rem}
      @media(min-width:640px){.street-grid{grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr)}}
      .col-head{padding:0 .25rem .125rem}
      .col-head p{margin:0}
      .col-head .nm{font-size:13px;font-weight:600;line-height:1.3;color:#33463a;text-shadow:0 1px 0 rgba(255,255,255,.7)}
      .col-head .sub{font-size:.75rem;color:#5c6f62;text-shadow:0 1px 0 rgba(255,255,255,.7)}
      .west-col{display:flex;flex-direction:column;gap:10px;min-width:0;margin-top:10px}
      .east-col{display:flex;flex-direction:column;min-width:0}
      .road{display:flex;flex-direction:column;align-items:center}
      .road-body{width:100%;flex:1;border-radius:999px;background:rgba(207,201,188,.7);box-shadow:inset 0 1px 3px rgba(0,0,0,.12);outline:1px solid rgba(0,0,0,.05);display:flex;justify-content:center}
      .road-body i{width:0;height:100%;border-left:2px dashed #f7f2df}
      .summary{margin-top:1rem;text-align:center;font-size:.875rem;color:var(--dim)}

      /* ── Slot cards ─────────────────────────────────────── */
      .slot-btn{display:block;width:100%;text-align:left;min-height:0}
      .face{border-radius:.75rem;border:2px solid #7d9a80;background:rgba(255,255,255,.9);
        box-shadow:0 1px 2px rgba(0,0,0,.06);backdrop-filter:blur(1px);display:flex;align-items:center;gap:.5rem;padding:0 .625rem;height:64px}
      .face.dashed{border-style:dashed;border-color:#a9bda9}
      .face.large{height:128px}
      .face.sel{border-color:var(--accent)}
      /* 骰子摇中后“就吃这家”：先定位到店铺标签，边框用它自己的颜色发亮闪两下再开详情 */
      .slot-glow{animation:slot-glow 1.5s ease-in-out;position:relative;z-index:5}
      @keyframes slot-glow{
        0%,100%{box-shadow:0 1px 2px rgba(0,0,0,.06)}
        25%,75%{box-shadow:0 0 0 3px var(--glow,#ffc800),0 0 24px 8px var(--glow-soft,rgba(255,180,0,.7));filter:brightness(1.1)}
        50%{box-shadow:0 1px 2px rgba(0,0,0,.06)}
      }
      .chip{width:2rem;height:2rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:.5rem;
        font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:700;background:#eef3ea;color:#40513f}
      .chip.filled{background:var(--green);color:#fff}
      .face-main{min-width:0}
      .face-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.875rem;font-weight:500}
      .face-name.dim{color:#5c6f62}
      .face-sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.75rem;color:#93a495}
      .face-go{margin-left:auto;flex-shrink:0;display:flex;align-items:center;gap:.125rem;font-size:.75rem;font-weight:500;color:var(--green);white-space:nowrap}
      .face-go .arr{font-size:.875rem;line-height:1}
      .face-go .txt{display:none}
      @media(min-width:480px){.face-go .txt{display:inline}}
      .premium-badge{position:absolute;right:.25rem;top:.25rem;z-index:2;border-radius:999px;
        background:linear-gradient(135deg,#f3d67b,#d9a514);padding:0 .375rem;font-size:10px;font-weight:700;line-height:1.5;color:#4a3503;
        box-shadow:0 1px 2px rgba(0,0,0,.15);outline:1px solid rgba(184,134,11,.6)}
      .slot-wrap{position:relative;z-index:1}
      /* compact (small) tags: exactly half height, one row */
      .face.compact{height:32px;gap:.375rem;padding:0 .5rem}
      .chip-sm{height:1.25rem;min-width:1.75rem;padding:0 .25rem;border-radius:.375rem;font-size:10px}
      .face.compact .face-name{font-size:13px}
      .star{flex-shrink:0;font-size:11px;line-height:1;color:var(--gold)}
      .face.compact .face-go{font-size:.875rem}
      /* gate */
      .gate-face{height:256px;justify-content:center;gap:.375rem;text-align:center;border:1px solid rgba(255,255,255,.7);
        background:rgba(255,255,255,.35);backdrop-filter:blur(8px);color:#2e4034;font-size:13px;font-weight:600;line-height:1.3;
        border-radius:.75rem;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;align-items:center;padding:0 .5rem}
      .gate-face .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:700;color:#5c6f62}
      /* plaza */
      .plaza-face{justify-content:center;gap:.5rem;text-align:center;border:2px dashed rgba(157,180,162,.8);
        background:rgba(238,244,230,.7);color:#5c6f62;font-size:13px;font-weight:500;border-radius:.75rem;display:flex;align-items:center;padding:0 .5rem}
      .plaza-face .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:700}
      /* big plaza row (W99) */
      .plaza-big{position:relative;z-index:1;display:flex;flex-direction:column;border:2px dashed rgba(157,180,162,.8);
        background:rgba(238,244,230,.7);border-radius:.75rem;padding:.5rem;min-height:192px}
      .plaza-big-head{display:flex;width:100%;flex-direction:column;align-items:center;gap:.125rem;border-radius:.5rem;padding:.25rem;min-height:0}
      .plaza-big-head .t1{display:flex;align-items:center;gap:.5rem;font-size:13px;font-weight:500;color:#5c6f62}
      .plaza-big-head .t2{font-size:11px;line-height:1.3;color:#7b8b7c}
      .plaza-shops{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:.375rem;padding-top:.5rem}
      .plaza-shop{display:flex;min-height:76px;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;
        border-radius:.5rem;background:rgba(255,255,255,.9);padding:.5rem .25rem;box-shadow:0 1px 2px rgba(0,0,0,.06);outline:1px solid rgba(125,154,128,.7)}
      .plaza-shop .code{align-self:center;display:flex;height:1.25rem;min-width:1.75rem;align-items:center;justify-content:center;border-radius:.375rem;
        background:var(--green);padding:0 .25rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:700;color:#fff}
      .plaza-shop .nm{text-align:center;font-size:.75rem;font-weight:500;line-height:1.3}
      /* fence */
      .fence-face{display:flex;align-items:center;gap:.5rem;padding:0 .125rem;height:32px}
      .fence-face .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:700;color:#7b8b7c}
      .fence-slats{height:.875rem;flex:1;border-radius:.125rem;outline:1px solid rgba(138,154,134,.6);
        background:repeating-linear-gradient(90deg,#a8bda4 0 5px,#e6eee1 5px 9px)}

      /* ── Overlays / sheets ──────────────────────────────── */
      .overlay{position:fixed;inset:0;z-index:50}
      .backdrop{position:absolute;inset:0;width:100%;height:100%;background:rgba(0,0,0,.45);cursor:default;min-height:0}
      .backdrop.dark{background:rgba(0,0,0,.55)}
      .sheet-wrap{display:flex;align-items:flex-end;justify-content:center;height:100%}
      @media(min-width:640px){.sheet-wrap{align-items:center}}
      .sheet{position:relative;max-height:88dvh;width:100%;max-width:36rem;overflow-y:auto;border-radius:1rem 1rem 0 0;
        background:var(--surface);padding:1rem;box-shadow:0 20px 40px rgba(0,0,0,.25)}
      @media(min-width:640px){.sheet{border-radius:1rem}}
      .sheet h2{font-size:1.125rem;font-weight:600;margin:0}
      .sheet h2 .meta{margin-left:.5rem;font-size:.875rem;font-weight:400;color:var(--dim)}
      .sheet .note{margin:.25rem 0 0;font-size:.875rem;color:var(--dim)}
      .like-row{display:flex;align-items:center;gap:.75rem;margin-top:.75rem}
      .like-btn{border-radius:999px;padding:.5rem 1.125rem;font-size:.875rem;font-weight:600;background:#fff;color:#d9482f;outline:2px solid #d9482f;min-height:2.5rem;cursor:pointer}
      .like-btn.liked{background:#d9482f;color:#fff}
      .like-btn:disabled{cursor:default}
      .close-x{border-radius:999px;padding:0 .5rem;font-size:1.125rem;line-height:1;color:var(--dim);flex-shrink:0}
      .chips{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:.75rem}
      .chip-pill{border-radius:999px;padding:.25rem .625rem;font-size:.75rem;font-weight:600}
      .chip-tag{border-radius:999px;padding:.25rem .625rem;font-size:.75rem;background:#f1f4ee;color:#5c6f62;outline:1px solid var(--border)}
      .chip-premium{border-radius:999px;padding:.25rem .625rem;font-size:.75rem;font-weight:700;color:#4a3503;
        background:linear-gradient(135deg,#f3d67b,#d9a514);outline:1px solid rgba(184,134,11,.6)}
      .detail-sec{margin-top:1rem}
      .detail-sec h3{font-size:1rem;font-weight:600;margin:0 0 .5rem}
      .detail-sec+.detail-sec{margin-top:1.25rem}
      .placeholder{display:flex;align-items:center;justify-content:center;border-radius:.75rem;border:2px dashed #c3d2c0;
        background:#f7faf3;padding:2rem .75rem;font-size:.875rem;color:#7b8b7c;text-align:center}
      .placeholder.tall{padding:3.5rem .75rem}
      .sign-img{width:100%;border-radius:.75rem;object-fit:cover;box-shadow:0 1px 2px rgba(0,0,0,.08);outline:1px solid var(--border)}
      .menu-list{list-style:none;margin:0;padding:0}
      .menu-list li{display:flex;justify-content:space-between;gap:.75rem;padding:.5rem .25rem;border-bottom:1px solid var(--border);font-size:.9375rem}
      .menu-list li:last-child{border-bottom:none}
      .menu-list b{font-weight:700;white-space:nowrap}
      .menu-note{margin:.5rem .25rem 0;font-size:.875rem;color:var(--dim)}

      /* full-page overlays (search) */

    function classifyShop(name, code){
      if (code && USER_OVERRIDES[code]){
        var o = USER_OVERRIDES[code];
        return {category: o.c, tags: o.t};
      }
      if (!name) return null;
      if (OVERRIDES[name]) return OVERRIDES[name];
      if (hasWord(name, NON_FOOD_WORDS)) return null;
      if (UNCLASSIFIED_NAMES.indexOf(name)>=0) return null;
      function has(){ return hasWord(name, Array.prototype.slice.call(arguments)); }
      var category;
      if (has("螺")) category = "hotpot";
      else if (has("火锅","麻辣烫","冒菜","肥羊","冬阴")) category = "hotpot";
      else if (hasWord(name, DRINK_WORDS)) category = "drinks";
      else if (hasWord(name, STIRFRY_WORDS)) category = "stirfry";
      else if (has("炒粉","炒面","炒饭","炒米粉","卷筒粉","锅巴土豆")) category = "snacks";
      else if (hasWord(name, SNACK_FIRST_WORDS)) category = "snacks";
      else if (has("烧鸭粉")) category = "noodles";
      else if (hasWord(name, BBQ_WORDS)) category = "bbq";
      else if (hasWord(name, NOODLE_WORDS)) category = "noodles";
      else category = "snacks";
      return {category: category, tags: buildTags(name, category)};
    }

    /* ═══════════ 街道布局：高度模型 + 东街对齐求解（与原版一致） ═══════════ */
    var STD_H = 64, GAP = 10;
    function heightUnits(s){
      if (s.kind==="gate") return 4;
      if (isBigPlaza(s)) return 3;
      if (s.size==="s") return 0.5;
      if (s.size==="l") return 2;
      return 1;
    }
    function pxHeight(s){ if (s.kind==="fence") return 32; return heightUnits(s)*STD_H; }
    function heightDesc(s){
      if (s.kind==="gate") return "高度为 4 个标准标签";
      if (s.kind==="fence") return "分隔栅栏";
      var u = heightUnits(s);
      if (u===0.5) return "小标签，高度为标准的一半";
      if (u===2) return "大标签，高度为标准的两倍";
      if (u===3) return "大广场，高度为 3 个标准标签";
      return "标准标签高度";
    }
    function cumulativeTops(list){
      var tops=[], y=0;
      list.forEach(function(s){ tops.push(y); y += pxHeight(s)+GAP; });
      return tops;
    }
    function eastSpacers(west, east){
      var n = east.length;
      var spacers = []; for (var k=0;k<n;k++) spacers.push(GAP);
      if (n===0) return spacers;
      spacers[0] = GAP;
      if (west.length<=98 || n<=187) return spacers;
      var westTops = cumulativeTops(west).map(function(y){ return y+GAP; });
      function westTop(i){ return westTops[i]; }
      function westBottom(i){ return westTops[i]+pxHeight(west[i]); }
      function heightSum(from,to){ var a=0; for (var i=from;i<=to;i++) a+=pxHeight(east[i]); return a; }
      var anchors = [
        [17,"top",westTop(27)],
        [39,"bottom",westBottom(38)],
        [40,"top",westTop(39)],
        [69,"top",westTop(54)],
        [99,"top",westBottom(65)],
        [109,"top",westTop(67)],
        [137,"bottom",westBottom(79)],
        [147,"top",westTop(83)],
        [187,"top",westBottom(98)],
        [n-1,"bottom",westBottom(west.length-1)]
      ];
      var MAX_SPACER = 40;
      var solved = [];
      var edgeIndex = 0, edgeIsTop = true, edgeY = GAP;
      anchors.forEach(function(an){
        var idx = an[0], edge = an[1], targetY = an[2];
        var contentFrom = edgeIsTop ? edgeIndex : edgeIndex+1;
        var contentTo = edge==="top" ? idx-1 : idx;
        var content = contentTo>=contentFrom ? heightSum(contentFrom, contentTo) : 0;
        var count = idx - edgeIndex;
        var raw = targetY - edgeY - content;
        if (raw<0 && solved.length>=2){
          var prev = solved[solved.length-1];
          var prevCount = prev.to - prev.from + 1;
          var take = Math.min(prev.each*prevCount, -raw);
          if (take>0){
            prev.each -= take/prevCount;
            for (var i=prev.from;i<=prev.to;i++) spacers[i]=prev.each;
            edgeY -= take; raw += take;
          }
        }
        var each = (count>0 && raw>0) ? Math.min(raw/count, MAX_SPACER) : 0;
        for (var j=edgeIndex+1;j<=idx;j++) spacers[j]=each;
        solved.push({from:edgeIndex+1, to:idx, each:each});
        edgeY = edgeY + content + each*count;
        edgeIndex = idx; edgeIsTop = (edge==="top");
      });
      return spacers;
    }

      return wrapOpen + '<span class="face'+(large?" large":"")+(filled?"":" dashed")+'" style="'+colorStyle(s)+'">'

    }

      var shops = plazaRowShops.map(function(shop){
        return '<button type="button" class="plaza-shop" data-open="'+shop.id+'" aria-label="'+esc(shop.name)+"，铺位 "+shop.code+"，开在 W99 广场边，点开查看详情"+'">'

    function renderStreet(){
      var westHTML = "";
      westLayout.forEach(function(s,i){
        if (isBigPlaza(s)){ westHTML += plazaRowHTML(s); return; }
        if (s.name==="云南食野" && westLayout.some(isBigPlaza)) return;

      var westModel = westLayout.some(isBigPlaza) ? westLayout.filter(function(s){ return s.name!=="云南食野"; }) : westLayout;

      var idx = sideList.indexOf(slot);

        + (slot.plazaExtra ? "在 W99 广场边，与云南食野（W100）同排，店门朝向广场 · " : "从北往南第 "+(idx+1)+" 个 · ")
        + heightDesc(slot);
      var note = "";
      if (slot.kind==="empty") note = '<p class="note">空铺位 — 店名、照片、菜单、营业时间、营业状态、评价标签待后续填入</p>';
      else if (slot.kind!=="shop") note = '<p class="note">'+(isBigPlaza(slot) ? "广场空地，不是店铺；广场边同排从左到右开着糯叽叽星球、土家鲜肉饼、云南食野，店门都朝向广场" : (FACILITY_NOTE[slot.kind]||""))+'</p>';
      var chips = "";
      if (slot.kind==="shop"){
        var info = classifyShop(slot.name, slot.code);
        var parts = [];

          info.tags.forEach(function(t){ parts.push('<span class="chip-tag">'+esc(t)+'</span>'); }); }
        if (slot.isPremium) parts.push('<span class="chip-premium">★ 精品店</span>');
        if (parts.length) chips = '<div class="chips">'+parts.join("")+'</div>';
      }
      var detail = "";
      if (slot.kind==="shop"){
        var tip = '补充或反馈请联系网页最上面的客服二维码';
        var media = SHOP_MEDIA[slot.code] || null;
        var sign = slot.name==="茶瀑布"
          ? '<img class="sign-img" loading="lazy" src="cha-pubu-sign.jpg" alt="茶瀑布店面招牌照片：绿色招牌上白色大字“茶瀑布”，旁边写着“原叶鲜奶茶”" />'
          : (media && media.sign

            : '<div class="placeholder tall">'+tip+'</div>');
        var menu = (media && media.menu)
          ? '<ul class="menu-list">' + media.menu.map(function(m){ return '<li><span>'+esc(m[0])+'</span><b>'+esc(m[1])+'</b></li>'; }).join("") + '</ul>'
            + (media.menuNote ? '<p class="menu-note">'+esc(media.menuNote)+'</p>' : '')
          : '<div class="placeholder">'+tip+'</div>';
        var dish = (media && media.dish)
          ? '<img class="sign-img" loading="lazy" src="'+media.dish+'" alt="'+esc(media.dishAlt)+'" />'
          : '<div class="placeholder tall">'+tip+'</div>';

          + '<div class="detail-sec"><h3>菜单</h3>'+menu+'</div>'
          + '<div class="detail-sec"><h3>特色菜</h3>'+dish+'</div>';

      overlayRoot.innerHTML =
        '<div class="overlay" role="dialog" aria-modal="true" aria-label="铺位 '+slot.code+' 详情">'
        + '<button type="button" class="backdrop" data-close aria-label="关闭店铺详情"></button>'
        + '<div class="sheet-wrap"><section class="sheet" aria-label="铺位 '+slot.code+' 详情">'
        + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem">'
        + '<div><h2>'+esc(slot.name || ("铺位 "+slot.code))+'<span class="meta">'+esc(meta)+'</span></h2>'+note+'</div>'
        + '<button type="button" class="close-x" data-close aria-label="关闭铺位详情">×</button></div>'
        + chips + detail
        + (slot.kind==="shop" ? '<p class="note" id="shopViewCount">本店浏览量：加载中…</p>' : '')
        + (slot.kind==="shop" ? '<div class="like-row"><button type="button" class="like-btn" id="likeBtn">👍 点赞</button><span class="note" id="shopLikeCount">点赞：加载中…</span></div>' : '')
        + '</section></div></div>';

    /* 开屏广告已删除 2026-11-27 */
    /* ── 街道点击（事件委托） ── */
    document.addEventListener("click", function(e){

    /* ═══════════ 骰子 ═══════════ */
    var diceOpen = false, rolling = null, diceFlash = null, diceResult = null, diceHint = null, catPicker = false;
    var spinTimer = null, settleTimer = null;
    var diceSlot = document.getElementById("dicePanelSlot");
    function diePips(cls){ var h=""; for (var i=0;i<9;i++){ h += (i%2===0) ? '<i></i>' : '<span></span>'; } return h; }
    function renderDice(){
      var toggle = document.getElementById("diceToggle");
      toggle.setAttribute("aria-expanded", String(diceOpen));
      toggle.setAttribute("aria-label", diceOpen ? "收起骰子" : "展开骰子：不知道今天吃什么，摇一摇决定");
      document.getElementById("diceToggleLabel").textContent = diceOpen ? "收起骰子" : "摇骰子选吃的";
      document.getElementById("diceCaret").style.transform = diceOpen ? "rotate(180deg)" : "";
      document.getElementById("miniDie").className = "mini-die" + (diceOpen ? "" : " dice-bounce");
      if (!diceOpen){ diceSlot.innerHTML=""; return; }
      var outcome;
      if (rolling){
        outcome = '<p class="dice-flash"><span class="code mono">'+(diceFlash?diceFlash.code:"··")+'</span><b>'+(diceFlash?esc(diceFlash.name):"…")+'</b><span style="margin-left:.5rem;font-size:.875rem;color:var(--dim)">摇一摇…</span></p>';
      } else if (diceResult){
        outcome = '<button type="button" class="dice-result dice-result-pop '+(diceResult.die==="gold"?"gold":"rainbow")+'" id="diceResultBtn" aria-label="摇中了 '+diceResult.slot.code+" "+esc(diceResult.slot.name)+'，点击查看这家店的详情">'
          + '<span class="code mono">'+diceResult.slot.code+'</span><span class="nm">'+esc(diceResult.slot.name)+'</span><span class="go">就吃这家 ›</span></button>';
      } else if (diceHint){
        outcome = '<p class="dice-hint">'+esc(diceHint)+'</p>';
      } else {
        outcome = '<p class="dice-idle">点任意一个骰子，马上帮你选一家</p>';
      }
      var picker = "";
      if (catPicker && !rolling){
        var counts = CATEGORIES.map(function(c){
          return shopSlots.filter(function(s){ var i=classifyShop(s.name, s.code); return i && i.category===c.key; }).length;
        });
        var nodes = CATEGORIES.map(function(c,i){
          var ang = (i*60-90)*Math.PI/180, r = 88;
          var x = Math.cos(ang)*r, y = Math.sin(ang)*r;
          return '<button type="button" class="cat-node" data-cat="'+c.key+'" style="background:'+c.bg+';color:'+c.text+';transform:translate(calc(-50% + '+x.toFixed(1)+'px), calc(-50% + '+y.toFixed(1)+'px))" aria-label="摇'+c.label+'分类的店铺，共 '+counts[i]+' 家"><b>'+c.label+'</b><span>'+counts[i]+' 家</span></button>';
        }).join("");
        picker = '<div class="cat-picker"><p>想吃哪一类？点一类开始摇</p>'
          + '<div class="cat-circle" role="group" aria-label="选择要摇的分类">'
          + '<button type="button" class="cat-center" data-cat="all" aria-label="摇全部店铺，共 '+shopSlots.length+' 家"><b>全部</b><span>'+shopSlots.length+' 家</span></button>'
          + nodes + '</div>'
          + '<div class="cat-cancel-row"><button type="button" class="fold-btn" id="catCancel">取消</button></div></div>';
      }
      diceSlot.innerHTML =
        '<div class="dice-panel">'
        + '<div class="dice-panel-head"><p>不知道今天吃什么？摇一摇骰子决定</p>'
        + '<button type="button" class="fold-btn" id="diceFold">收起</button></div>'
        + '<div class="dice-pair">'
        + '<div class="die-cell"><button type="button" id="dieRainbow" aria-label="摇六彩骰子：先选一个分类，再从该分类里随机选一家" '+(rolling?"disabled":"")+'><span class="big-die die-rainbow'+(rolling==="rainbow"?" dice-rolling":"")+'" aria-hidden="true">'+diePips()+'</span></button><span>六彩骰子<br/>先选分类</span></div>'
        + '<div class="die-cell"><button type="button" id="dieGold" aria-label="摇金骰子：只从精品店铺里随机选一家" '+(rolling?"disabled":"")+'><span class="big-die die-gold'+(rolling==="gold"?" dice-rolling":"")+'" aria-hidden="true">'+diePips()+'</span></button><span>金骰子<br/>精品店铺（'+premiumSlots.length+' 家）</span></div>'
        + '</div>' + picker
        + '<div class="dice-outcome" aria-live="polite">'+outcome+'</div></div>';
      document.getElementById("diceFold").addEventListener("click", toggleDice);
      document.getElementById("dieRainbow").addEventListener("click", function(){
        diceHint=null; diceResult=null; catPicker=true; renderDice();
      });
      document.getElementById("dieGold").addEventListener("click", function(){ rollDice("gold", null); });
      var cc = document.getElementById("catCancel");
      if (cc) cc.addEventListener("click", function(){ catPicker=false; renderDice(); });
      diceSlot.querySelectorAll("[data-cat]").forEach(function(b){
        b.addEventListener("click", function(){
          var k = b.getAttribute("data-cat");
          catPicker=false;
          rollDice("rainbow", k==="all" ? null : k);
        });
      });
      var rb = document.getElementById("diceResultBtn");
      if (rb) rb.addEventListener("click", function(){ goToShopAndOpen(diceResult.slot); });
    }
    /* ── 骰子摇中后点“就吃这家”：收起骰子 → 滚动定位到街上那家店 → 标签边框金光闪两下 → 再点开详情 ── */
    function goToShopAndOpen(slot){
      var s = slot;
      diceOpen = false; diceResult = null; catPicker = false; renderDice();
      var btn = document.querySelector('#westCol [data-open="'+s.id+'"], #eastCol [data-open="'+s.id+'"]');
      if (!btn){ openDetail(s); return; }
      var face = btn.querySelector('.face') || btn;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      /* 发光用标签自己的边框色；精品店是彩虹渐变边框，取不到单色就用金色 */
      var bc = window.getComputedStyle(face).borderTopColor;
      if (!bc || bc === 'rgba(0, 0, 0, 0)' || bc === 'transparent'){ bc = '#d9a514'; }
      var soft = bc;
      var m = bc.match(/rgba?\(([^)]+)\)/);
      if (m){ var p = m[1].split(','); soft = 'rgba('+p[0].trim()+','+p[1].trim()+','+p[2].trim()+',0.65)'; }
      face.style.setProperty('--glow', bc);
      face.style.setProperty('--glow-soft', soft);
      btn.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'center'});
      window.setTimeout(function(){
        face.classList.add('slot-glow');
        window.setTimeout(function(){
          face.classList.remove('slot-glow');
          face.style.removeProperty('--glow');
          face.style.removeProperty('--glow-soft');
          openDetail(s);
        }, reduce ? 80 : 1500);
      }, reduce ? 80 : 650);
    }
    function rollDice(die, category){
      if (rolling) return;
      var pool = die==="gold" ? premiumSlots : (category
        ? shopSlots.filter(function(s){ var i=classifyShop(s.name, s.code); return i && i.category===category; })
        : shopSlots);
      if (!pool.length){
        diceResult=null;
        diceHint = die==="gold" ? "精品名单还没选，请先指定精品店铺" : (category ? "这个分类暂时还没有店铺" : "暂时还没有店铺可以摇");
        renderDice(); return;
      }
      diceHint=null; diceResult=null; rolling=die;
      function pick(){ return pool[Math.floor(Math.random()*pool.length)]; }
      diceFlash = pick(); renderDice();
      spinTimer = window.setInterval(function(){ diceFlash = pick(); renderDice(); }, 90);
      settleTimer = window.setTimeout(function(){
        window.clearInterval(spinTimer);
        var winner = pick();
        diceFlash=null; rolling=null; diceResult={die:die, slot:winner};
        renderDice();
      }, 1100);
    }
    function toggleDice(){
      diceOpen = !diceOpen;
      if (!diceOpen){
        if (spinTimer) window.clearInterval(spinTimer);
        if (settleTimer) window.clearTimeout(settleTimer);
        rolling=null; diceFlash=null; catPicker=false;
      }
      renderDice();
    }
    document.getElementById("diceToggle").addEventListener("click", toggleDice);

    /* ── 顶部折叠收起 ── */
    var pageHeader = document.querySelector("header");
    function setHeadCollapsed(on){
      pageHeader.classList.toggle("head-collapsed", on);

    }
    document.getElementById("headCollapseBtn").addEventListener("click", function(){ setHeadCollapsed(true); });
    document.getElementById("headExpandBtn").addEventListener("click", function(){ setHeadCollapsed(false); });
    try{ if (localStorage.getItem("qsj-head-collapsed")==="1") setHeadCollapsed(true); }catch(e){}

    /* ═══════════ 搜索 ═══════════ */
    function shopRowHTML(slot){
      var info = classifyShop(slot.name, slot.code);
      var cat = info ? categoryOf(info.category) : null;
      return '<button type="button" class="shop-row" data-open="'+slot.id+'" aria-label="'+esc(slot.name)+"，铺位 "+slot.code+"，查看详情"+'">'
        + '<span class="code">'+slot.code+'</span>'
        + '<span class="main"><span class="nm">'+esc(slot.name)+(slot.isPremium?' <span style="color:#b8860b" aria-hidden="true">★</span>':'')+'</span>'
        + (info ? '<span class="tg">'+esc(info.tags.join(" · "))+'</span>' : '')
        + '</span>'
        + (cat ? '<span class="cat" style="background:'+cat.bg+';color:'+cat.text+'">'+cat.label+'</span>' : '')
        + '</button>';
    }
    function openSearch(){
      overlayRoot.innerHTML =
        '<div class="page-overlay" role="dialog" aria-modal="true" aria-label="搜索店铺"><div class="page-inner">'
        + '<div class="page-head"><div class="search-row">'
        + '<label class="search-field"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex-shrink:0;color:var(--dim)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>'
        + '<span style="position:absolute;width:1px;height:1px;overflow:hidden">搜索店名或标签</span>'
        + '<input type="search" id="searchInput" placeholder="输入店名或标签，如：螺蛳粉、清淡" aria-label="输入店名或标签搜索" /></label>'
        + '<button type="button" class="cancel-btn" data-close>取消</button></div></div>'
        + '<div id="searchBody"></div>'
        + '</div></div>';
      lockScroll(true);
      overlayRoot.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeTop); });
      var input = document.getElementById("searchInput");
      var state = {q:"", tag:null};
      function renderBody(){
        var body = document.getElementById("searchBody");
        var classified = shopSlots.map(function(s){ return {slot:s, info:classifyShop(s.name, s.code)}; });
        var tagCounts = {};
        classified.forEach(function(c){ if (c.info) c.info.tags.forEach(function(t){ tagCounts[t]=(tagCounts[t]||0)+1; }); });
        var tags = Object.keys(tagCounts).sort(function(a,b){ return tagCounts[b]-tagCounts[a]; });
        var html = "";
        if (!state.q){
          html += '<h3 class="sec-title" style="margin-top:.75rem">六大类</h3><div class="chip-cloud">'
            + CATEGORIES.map(function(c){
                var cnt = classified.filter(function(x){ return x.info && x.info.category===c.key; }).length;
                var on = state.tag===c.label;
                return '<button type="button" class="cat-chip" data-tag="'+c.label+'" aria-pressed="'+on+'" style="background:'+c.bg+';color:'+c.text+';outline:'+(on?"2px":"1px")+' solid '+c.text+'">'+c.label+'<span class="cnt">'+cnt+' 家</span></button>';
              }).join("") + '</div>';
          html += '<h3 class="sec-title" style="margin-top:1.25rem">美食标签</h3><div class="chip-cloud">'
            + tags.map(function(t){
                var on = state.tag===t;
                return '<button type="button" class="tag-chip'+(on?" on":"")+'" data-tag="'+esc(t)+'" aria-pressed="'+on+'">'+esc(t)+'<span class="cnt">'+tagCounts[t]+'</span></button>';
              }).join("") + '</div>';
        }
        var q = state.q.trim();
        var results = null;
        if (q){
          results = classified.filter(function(c){
            return (c.slot.name||"").indexOf(q)>=0 || (c.info && ((c.info.category ? categoryOf(c.info.category).label : "").indexOf(q)>=0 || c.info.tags.some(function(t){ return t.indexOf(q)>=0; })));
          });
        } else if (state.tag){
          results = classified.filter(function(c){
            return c.info && ((c.info.category ? categoryOf(c.info.category).label : "")===state.tag || c.info.tags.indexOf(state.tag)>=0);
          });
        }
        if (results){
          html += '<div style="margin-top:1.25rem"><p style="font-size:.875rem;color:var(--dim)" aria-live="polite">'
            + (q ? "“"+esc(q)+"”共找到 "+results.length+" 家" : "“"+esc(state.tag)+"”下共 "+results.length+" 家") + '</p>'
            + '<div class="row-list">'
            + (results.length ? results.map(function(c){ return shopRowHTML(c.slot); }).join("") : '<p class="empty-note">没找到，换个关键词试试</p>')
            + '</div></div>';
        } else if (!q){
          html += '<p class="empty-note" style="margin-top:1.5rem">点一个分类或标签，就能看到这一类所有的店</p>';
        }
        body.innerHTML = html;
        body.querySelectorAll("[data-tag]").forEach(function(b){
          b.addEventListener("click", function(){
            var t = b.getAttribute("data-tag");
            state.tag = (state.tag===t) ? null : t;
            renderBody();
          });
        });
      }
      input.addEventListener("input", function(){ state.q = input.value; renderBody(); });
      renderBody();
      input.focus();
    }
    document.getElementById("searchOpenBtn").addEventListener("click", openSearch);


    /* ═══════════ 浏览量（CountAPI，GitHub Pages 专用） ═══════════ */
    var COUNT_BASE = 'https://countapi.mileshilliard.com/api/v1/';
    function countFetch(key, hit){
      var url = COUNT_BASE + (hit ? 'hit/' : 'get/') + encodeURIComponent(key);
      return fetch(url).then(function(r){ return r.json(); }).then(function(d){ return (d && typeof d.value==='number') ? d.value : null; }).catch(function(){ return null; });
    }
    function localDateStr(d){
      var m = d.getMonth()+1, day = d.getDate();
      return d.getFullYear() + '-' + (m<10?'0':'') + m + '-' + (day<10?'0':'') + day;
    }
    function initSiteViews(){
      // 计数全部延后跑，不跟街面、图片抢网速；三个数各一个独立计数器，只查 3 次
      var run = function(){
      var today = localDateStr(new Date());
      var seenKey = 'qsj-counted-' + today;
      var seen = localStorage.getItem(seenKey);
      var hit = !seen;
      if (hit) localStorage.setItem(seenKey, '1');
      var ym = today.slice(0, 7);
      var totalP = countFetch('qingchun-shijie-total', hit);
      var todayP = countFetch('qingchun-shijie-day-' + today, hit);
      var monthP = countFetch('qingchun-shijie-month-' + ym, hit);
      totalP.then(function(v){ var el=document.getElementById('vcTotal'); if(el) el.textContent = (v===null?'–':v); });
      todayP.then(function(v){ var el=document.getElementById('vcToday'); if(el) el.textContent = (v===null?'–':v); });
      monthP.then(function(v){ var el=document.getElementById('vcMonth'); if(el) el.textContent = (v===null?'–':v); });
      };
      if ('requestIdleCallback' in window) requestIdleCallback(run, {timeout: 2000});
      else setTimeout(run, 1000);
    }
    function recordShopView(slot){
      if (!slot || slot.kind!=='shop') return;
      var today = localDateStr(new Date());
      var key = 'qingchun-shijie-shop-' + slot.code;
      var seenKey = 'qsj-shop-' + slot.code + '-' + today;
      var hit = !localStorage.getItem(seenKey);
      if (hit) localStorage.setItem(seenKey, '1');
      countFetch(key, hit).then(function(v){
        var el = document.getElementById('shopViewCount');
        if (el) el.textContent = '本店浏览量：' + (v===null ? '–' : v) + '（每台设备每天只记 1 次）';
      });
    }

    /* ── 店铺点赞（每台设备、每家店、每天只记 1 次；点开详情时才加载） ── */
    function loadShopLikes(slot){
      if (!slot || slot.kind!=='shop') return;
      var today = localDateStr(new Date());
      var key = 'qingchun-shijie-like-' + slot.code;
      var likedKey = 'qsj-like-' + slot.code + '-' + today;
      var liked = !!localStorage.getItem(likedKey);
      countFetch(key, false).then(function(v){
        var el = document.getElementById('shopLikeCount');
        if (el) el.textContent = '点赞：' + (v===null ? '0' : v);
        var btn = document.getElementById('likeBtn');
        if (!btn) return;
        if (liked){ btn.textContent = '👍 已点赞'; btn.classList.add('liked'); btn.disabled = true; return; }
        btn.addEventListener('click', function(){
          btn.disabled = true;
          localStorage.setItem(likedKey, '1');
          countFetch(key, true).then(function(nv){
            var el2 = document.getElementById('shopLikeCount');
            if (el2) el2.textContent = '点赞：' + (nv===null ? '0' : nv);
            btn.textContent = '👍 已点赞'; btn.classList.add('liked');
          });
        });
      });
    }

    /* ═══════════ 开屏海报广告（每天只弹一次） ═══════════ */
    function showPosterAd(){
      var today = localDateStr(new Date());
      var seenKey = 'qsj-ad-' + today;
      if (localStorage.getItem(seenKey)) return;
      localStorage.setItem(seenKey, '1');
      overlayRoot.innerHTML =
        '<div class="overlay" role="dialog" aria-modal="true" aria-label="青春食街海报">'
        + '<button type="button" class="backdrop" data-close aria-label="关闭海报"></button>'
        + '<div class="center-wrap"><div class="ad-card">'
        + '<div class="ad-head"><span class="k">青春食街</span><button type="button" class="close-x" data-close aria-label="关闭">×</button></div>'
        + '<div class="ad-poster-btn"><img src="poster.jpg" alt="青春食街宣传海报：一条街，吃遍上百家，扫码进入美食街" /></div>'
        + '<p class="ad-hint">长按保存海报，扫码随时回来，也能发给朋友</p>'
        + '<button type="button" class="ad-enter" data-close>进入美食街 ›</button>'
        + '</div></div></div>';
      lockScroll(true);
      overlayRoot.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeTop); });
    }

    /* ═══════════ 启动 ═══════════ */

    renderStreet();
    showPosterAd();
    initSiteViews();
    </script>
    <button type="button" id="backTop" class="back-top" aria-label="回到顶部">↑</button>
    <script>
      (function(){
        var btn = document.getElementById('backTop');
        function toggle(){ btn.classList.toggle('show', window.scrollY > 600); }
        window.addEventListener('scroll', toggle, {passive:true});
        toggle();
        btn.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
      })();
    </script>
  </body>
</html>
